/* v3: image-led honey cards, clean report list and zoomable report viewer */
.metric-card{position:relative;overflow:hidden;padding:17px;border-radius:19px;border:1px solid transparent;box-shadow:0 10px 28px #0003}

.metric-card .metric-heading img,.metric-card .metric-emoji{width:34px;height:34px;object-fit:contain;display:grid;place-items:center;flex-shrink:0;border-radius:10px;padding:5px;background:#ffffff27}

.honey-card{background:linear-gradient(135deg,#ffdb70,#f6a928 70%,#d98317);border-color:#ffe7a1;color:#452506}
.rate-card{background:linear-gradient(135deg,#8deaff,#38a9db 72%,#2770bb);border-color:#9cefff;color:#082b48}

.report-list{gap:8px}

.report-item:last-child{border-bottom:1px solid #343d5c}
.report-item:active{transform:scale(.99)}
.report-date-time{display:flex;align-items:center;gap:12px;min-width:0}

<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo"><img src="https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Spiritcloseup.png" alt="Spirit Bear" onerror="this.parentElement.textContent='🐻'"></div><div><h1>Macro Monitor</h1><p>Natro Macro companion · prototype</p></div></div><div class="top-actions"><div class="pill"><i class="dot"></i><span id="connectionText">Connected · Demo data</span></div><button class="btn" id="simulateDisconnect">Simulate connection</button></div></header>

<div class="footer-note">Interactive UI prototype · Uses fictional sample data only. Commands are simulated and are not sent to Natro Macro.</div>
</div><div class="toast" id="toast"></div>
<script>

const reports=[

{time:'18:00',date:'Oct 13, 2026',range:'17:00 – 18:00',honey:'+912M',rate:'912M/hr',field:'Bamboo Field',pollen:'681.4B',uptime:'56m',boosts:'None recorded',items:'1.9k',disconnects:'2',vals:[18,24,29,34,39,41,49,55]},

const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function accountSelector(){return `<div class="account-pick"><select class="select" id="accountSelect" aria-label="Choose account">${Object.keys(accounts).map(a=>`<option value="${a}" ${a===current?'selected':''}>${a} · Hive Lv. ${accounts[a].hiveLevel}</option>`).join('')}</select><button class="level-edit" id="editHiveLevel" aria-label="Edit hive level" title="Edit hive level">✎</button></div>`}
function header(title,sub,close=false){return `<div class="view-head"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${close?'<button class="close-btn" id="closeView" aria-label="Close view">×</button>':accountSelector()}</div>`}
function fieldIcon(field){const icons={"Pine Tree Forest":"https://static.wikia.nocookie.net/bee-swarm-simulator/images/d/db/Pine_Tree_Forest_Icon.png/revision/latest?cb=20230410080237","Blue Flower Field":"https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Blue_Flower_Field_Icon.png","Bamboo Field":"https://static.wikia.nocookie.net/bee-swarm-simulator/images/b/b0/Bamboo_Field_Icon.png/revision/latest?cb=20230410080335"};return icons[field]||icons["Pine Tree Forest"]}
function statusIcon(status){if(status==='Paused')return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>';if(status==='Stopped')return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg>'}
function dashboard(){const a=accounts[current];const latest=reports[0];return `${header('Live dashboard',`Live session overview · ${esc(a.hive)} · Hive Lv. ${a.hiveLevel}`)}<div class="grid"><section class="card metric-card honey-card span-4"><div class="metric-heading"><img src="https://static.wikia.nocookie.net/bee-swarm-simulator/images/c/c6/Honey.png/revision/latest?cb=20230410071605" alt="BSS Honey" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=metric-emoji>🍯</span>')"><span>Current honey</span></div><div class="big">${a.honey}</div><div class="sub">Total honey collected</div><div style="margin-top:13px" class="trend">↗ Session is active</div></section><section class="card metric-card rate-card span-4"><div class="metric-heading"><img src="https://static.wikia.nocookie.net/bee-swarm-simulator/images/b/bb/Gifted_Diamond_Bee.png/revision/latest?cb=20200404001105" alt="Gifted Diamond Bee" onerror="this.style.display='none'"><span>Honey per hour</span></div><div class="big">${a.rate}</div><div class="sub">Honey earned / hour</div><div style="margin-top:13px;font-size:12px;font-weight:750">LAST HOUR</div></section><section class="card metric-card status-card span-4"><div class="metric-heading"><span class="status-glyph">${statusIcon(a.status)}</span><span>Macro status</span></div><div class="big" style="font-size:23px;letter-spacing:-.4px">${a.status}</div><div class="sub">Since ${a.since}</div><div style="margin-top:13px;font-size:12px;font-weight:750">${a.status==='Paused'?'PAUSED':a.status==='Stopped'?'STOPPED':'PLAYING'}</div></section>
<section class="card span-7 activity-card"><div class="cardtop"><div><strong>Current activity</strong><div class="sub">Current macro field</div></div><span class="tiny-tag">LIVE</span></div><div class="activity-field"><span class="field-icon"><img src="${fieldIcon(a.field)}" alt="${esc(a.field)} icon" onerror="this.style.display='none'"></span><div><strong>${a.field}</strong>${a.booster?'<div class="boosted-label">BOOSTED</div>':''}</div></div></section>
<section class="card span-12"><div class="cardtop"><div><strong>Planters</strong><div class="sub">Example planter shortcuts · live timers will come from Natro integration</div></div><span class="tiny-tag">3 SLOTS</span></div><div class="planter-strip"><div class="planter-chip"><img src="https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Plastic_Planter.png" alt="Plastic Planter" onerror="this.src='https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Planter.png'"><strong>Plastic Planter</strong><span>Not connected</span></div><div class="planter-chip"><img src="https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Blue_Clay_Planter.png" alt="Blue Clay Planter"><strong>Blue Clay Planter</strong><span>Not connected</span></div><div class="planter-chip"><img src="https://bee-swarm-simulator.fandom.com/wiki/Special:FilePath/Candy_Planter.png" alt="Candy Planter"><strong>Candy Planter</strong><span>Not connected</span></div></div></section>
<section class="card span-5"><div class="cardtop"><div><strong>Command console</strong><div class="sub">Send a command to the selected account</div></div><span class="tiny-tag">REMOTE</span></div><form class="console" id="commandForm"><input id="commandInput" autocomplete="off" placeholder="Enter command, e.g. ?start" aria-label="Command" required><button class="primary" type="submit">Send</button></form><div class="quick"><button data-command="?start">?start</button><button data-command="?stop">?stop</button><button data-command="?pause">?pause</button><button data-command="?resume">?resume</button><button data-command="?planters">?planters</button><button data-command="?timers">?timers</button></div><div class="feedback" id="commandFeedback">Commands are simulated in this prototype.</div><div class="history"><div class="label" style="margin-bottom:6px">Recent command history</div>${history.slice(0,3).map(h=>`<div class="history-row"><span>${esc(h[0])}</span><span>${esc(h[1])}</span></div>`).join('')}</div></section>
<section class="card span-12 latest-report"><div class="cardtop"><div><strong>Latest hourly report</strong><div class="sub">Tap the image to zoom in</div></div><button class="secondary" data-open="reports">All reports ↗</button></div><img class="latest-report-image" data-zoom-report="${latest.time}" src="${reportImage(latest)}" alt="Latest hourly report image for ${latest.time}"><div class="latest-report-meta"><div><strong>${latest.time}</strong><div>${latest.date} · Report arrival time</div></div><span class="tiny-tag">HOURLY REPORT</span></div></section></div>`}
function reportImage(r){const vals=r.vals||[24,32,38,44,53,62,70,78];const pts=vals.map((v,i)=>`${20+i*45},${132-v*1.05}`).join(' ');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="380" height="166" viewBox="0 0 380 166"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292f61"/><stop offset=".6" stop-color="#172e49"/><stop offset="1" stop-color="#241b45"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8cdbff" stop-opacity=".55"/><stop offset="1" stop-color="#a59aff" stop-opacity="0"/></linearGradient></defs><rect width="380" height="166" rx="12" fill="url(#bg)"/><circle cx="342" cy="20" r="60" fill="#a28cff" opacity=".10"/><g stroke="#ffffff" stroke-opacity=".10"><path d="M16 42H364M16 72H364M16 102H364M16 132H364"/></g><text x="18" y="23" fill="#d8e9ff" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">HOURLY HONEY REPORT</text><text x="360" y="23" text-anchor="end" fill="#a5e9ff" font-family="Arial,sans-serif" font-size="10">${r.time} · ${r.rate}</text><polygon points="${pts} 335,145 20,145" fill="url(#area)"/><polyline points="${pts}" fill="none" stroke="#a9e8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="335" cy="${132-vals[vals.length-1]*1.05}" r="4" fill="#fff" stroke="#9be5ff" stroke-width="2"/><text x="18" y="158" fill="#bdc9e9" font-family="Arial,sans-serif" font-size="9">${r.field}</text><text x="360" y="158" text-anchor="end" fill="#d9d6ff" font-family="Arial,sans-serif" font-size="9">${r.honey} honey</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function reportRow(r){return `<button class="report-item" data-report="${r.time}"><span class="report-date-time"><span class="report-calendar">${r.time}</span><span class="report-date">${r.date}</span><span class="report-chevron">›</span></span></button>`}
function reportsView(){return `${header('Hourly reports','Choose a date and time to open its report',true)}<section class="card"><div class="cardtop" style="margin-bottom:14px"><div><strong>Report history</strong><div class="sub">Newest first · tap any entry for the report image and details</div></div><span class="tiny-tag">${reports.length} REPORTS</span></div><div class="report-list">${reports.map(reportRow).join('')}</div></section>`}
function detailView(r){return `<button class="backlink" id="backReports">← Back to reports</button>${header('Report · '+r.time,`${r.range} · arrived at ${r.time}`,true)}<section class="card"><div class="cardtop"><div><strong>Hourly summary</strong><div class="sub">${r.field} · ${current}</div></div><span class="tiny-tag">HOURLY REPORT</span></div><img class="report-image-large zoomable-report" data-zoom-report="${r.time}" src="${reportImage(r)}" alt="Hourly report image for ${r.time}" title="Tap to zoom"><div class="detail-grid"><div class="detail-stat"><span class="label">Honey made</span><strong>${r.honey}</strong></div><div class="detail-stat"><span class="label">Average honey / hour</span><strong>${r.rate}</strong></div><div class="detail-stat"><span class="label">Macro uptime</span><strong>${r.uptime}</strong></div><div class="detail-stat"><span class="label">Pollen collected</span><strong>${r.pollen}</strong></div><div class="detail-stat"><span class="label">Items collected</span><strong>${r.items}</strong></div><div class="detail-stat"><span class="label">Disconnects</span><strong>${r.disconnects}</strong></div></div><strong>Honey rate during this report</strong><div class="sub">Illustrative sample readings, not actual game telemetry</div><div class="chart">${r.vals.map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${v}%"></div><div class="bar-label">${i*8}m</div></div>`).join('')}</div><div class="field-row"><div><strong>Field</strong><div class="sub">Recorded for this report</div></div><span>${r.field}</span></div><div class="field-row"><div><strong>Boosters</strong><div class="sub">Detected during this hour</div></div><span>${r.boosts}</span></div><div class="field-row"><div><strong>Arrival time</strong><div class="sub">When Macro Monitor received this report</div></div><span>${r.time}</span></div></section>`}
function logsView(){return `${header('Webhook logs','Discord-style event feed · newest first',true)}<section class="card"><div class="cardtop" style="margin-bottom:15px"><div><strong>Macro event stream</strong><div class="sub">Account: ${current} · new messages appear at the bottom in a live connection</div></div><span class="status"><i class="dot"></i>Connected</span></div><div class="log-list" id="logList">${logs.map(l=>`<article class="log-entry"><div class="log-stripe ${l.color}"></div><div class="log-body"><div class="log-title"><strong>${esc(l.title)}</strong><time>${l.time}</time></div><p>${esc(l.body)}</p>${l.image?'<div class="log-image">Report graph / screenshot preview</div>':''}<div class="log-foot">${esc(l.foot.replace(current,current))}</div></div></article>`).join('')}</div><div class="footer-note">Demo embeds approximate Discord webhook formatting. Real embed colors, images, timestamps and message content will come from your webhook logs.</div></section>`}
function openZoom(r){
 if(!r)return;const existing=$('#zoomOverlay');if(existing)existing.remove();
 const overlay=document.createElement('div');overlay.className='zoom-overlay';overlay.id='zoomOverlay';
 overlay.innerHTML=`<div class="zoom-top"><div class="zoom-title">Hourly report · ${esc(r.date)} · ${esc(r.time)}</div><button id="zoomClose" class="zoom-close" aria-label="Close image viewer">×</button></div><div class="zoom-stage" id="zoomStage"><img id="zoomImage" src="${reportImage(r)}" alt="Zoomed hourly report ${esc(r.time)}" draggable="false"></div><div class="zoom-hint">Pinch with two fingers to zoom · double-tap to zoom · drag to move around</div>`;
 document.body.appendChild(overlay);const img=$('#zoomImage'),stage=$('#zoomStage');let scale=1,minScale=1,maxScale=5,lastTap=0,pointers=new Map(),startDistance=0,startScale=1,startX=0,startY=0,originX=0,originY=0,dragX=0,dragY=0,dragging=false;
 const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
 const apply=()=>{img.style.transform=`translate(${dragX}px,${dragY}px) scale(${scale})`;img.style.maxWidth=scale>1?'none':'100%';img.style.maxHeight=scale>1?'none':'100%';stage.classList.toggle('zoomed',scale>1.01);if(scale===1){dragX=dragY=0;stage.scrollTop=stage.scrollLeft=0;img.style.transform='translate(0px,0px) scale(1)'}};
 const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;stage.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const pts=[...pointers.values()];startDistance=distance(pts[0],pts[1]);startScale=scale}else if(pointers.size===1){startX=e.clientX;startY=e.clientY;originX=dragX;originY=dragY;dragging=scale>1.01;}});
 stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const pts=[...pointers.values()];if(startDistance>0){scale=clamp(startScale*distance(pts[0],pts[1])/startDistance,minScale,maxScale);apply()}e.preventDefault()}else if(pointers.size===1&&dragging&&scale>1.01){dragX=originX+(e.clientX-startX);dragY=originY+(e.clientY-startY);apply();e.preventDefault()}},{passive:false});
 const endPointer=e=>{pointers.delete(e.pointerId);if(pointers.size<2)startDistance=0;if(pointers.size===0)dragging=false};stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
 stage.addEventListener('click',e=>{if(e.target!==img&&e.target!==stage)return;const now=Date.now();if(now-lastTap<320){scale=scale>1.01?1:2.25;dragX=dragY=0;apply();lastTap=0}else lastTap=now});
 stage.addEventListener('wheel',e=>{e.preventDefault();scale=clamp(scale+(e.deltaY<0?.15:-.15),minScale,maxScale);apply()},{passive:false});
 const close=()=>overlay.remove();$('#zoomClose').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});const escKey=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',escKey)}};document.addEventListener('keydown',escKey);apply();
}
function render(){const main=$('#main');$('#nav').classList.toggle('hidden',view==='detail');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='dashboard')main.innerHTML=dashboard();else if(view==='reports')main.innerHTML=reportsView();else if(view==='logs')main.innerHTML=logsView();else if(view==='detail')main.innerHTML=detailView(detail);wire();}
function wire(){const sel=$('#accountSelect');if(sel)sel.addEventListener('change',e=>{current=e.target.value;render()});$('#editHiveLevel')?.addEventListener('click',()=>{const raw=prompt(`Set hive level for ${current}`,String(accounts[current].hiveLevel));if(raw===null)return;const level=Number.parseInt(raw,10);if(!Number.isInteger(level)||level<1||level>30){toast('Enter a hive level from 1 to 30');return}accounts[current].hiveLevel=level;render();toast(`${current} hive level set to ${level}`)});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;detail=null;render()}));document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.open;render()}));document.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>{detail=reports.find(r=>r.time===b.dataset.report);view='detail';render()}));document.querySelectorAll('[data-zoom-report]').forEach(img=>img.addEventListener('click',e=>{e.stopPropagation();openZoom(reports.find(r=>r.time===img.dataset.zoomReport))}));$('#closeView')?.addEventListener('click',()=>{view='dashboard';detail=null;render()});$('#backReports')?.addEventListener('click',()=>{view='reports';detail=null;render()});document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>sendCommand(b.dataset.command)));$('#commandForm')?.addEventListener('submit',e=>{e.preventDefault();sendCommand($('#commandInput').value.trim())});}
function sendCommand(cmd){if(!cmd)return;const now=new Date().toLocaleTimeString([],{hour12:false});history.unshift([cmd,now]);history=history.slice(0,8);const known=['?start','?stop','?pause','?resume','?planters','?timers','?status','?help'];const good=known.includes(cmd.toLowerCase());if(cmd.toLowerCase()==='?start')accounts[current].status='Macro running';if(cmd.toLowerCase()==='?pause')accounts[current].status='Paused';if(cmd.toLowerCase()==='?resume')accounts[current].status='Macro running';if(cmd.toLowerCase()==='?stop')accounts[current].status='Stopped';render();const msg=good?`Demo command “${cmd}” queued for ${current}.`:`Unknown demo command “${cmd}”. It was recorded but not sent.`;const f=$('#commandFeedback');if(f)f.textContent=msg;toast(good?'Command queued (demo)':'Command recorded (demo)');}
$('#simulateDisconnect').addEventListener('click',()=>{if(connection==='ok'){connection='server';phoneOnline=true;alertDismissed=false;$('#simulateDisconnect').textContent='Restore connection'}else if(connection==='server'){connection='phone';phoneOnline=false;alertDismissed=false;$('#simulateDisconnect').textContent='Restore connection'}else{connection='ok';phoneOnline=true;alertDismissed=false;$('#simulateDisconnect').textContent='Simulate connection'}updateConnection();render()});
function updateConnection(){const text=$('#connectionText');const area=$('#alertArea');if(connection==='ok'){text.innerHTML='<i class="dot"></i> Connected · Demo data';area.innerHTML='';return}if(connection==='server'){text.textContent='Server unreachable';if(!alertDismissed)area.innerHTML='<div class="alert"><div><strong>PC/server unreachable — The PC is off?</strong><span>The PC may be off, disconnected, or the macro monitoring service may have stopped. Displayed values are stale until the connection returns.</span></div><button aria-label="Dismiss alert" id="dismissAlert">×</button></div>'}else{text.textContent='Phone internet unavailable';if(!alertDismissed)area.innerHTML='<div class="alert orange"><div><strong>You might need to connect</strong><span>Your phone has no usable internet connection. Macro Monitor will reconnect automatically when network access returns.</span></div><button aria-label="Dismiss alert" id="dismissAlert">×</button></div>'}$('#dismissAlert')?.addEventListener('click',()=>{alertDismissed=true;area.innerHTML=''})}
render();
</script></body></html>
